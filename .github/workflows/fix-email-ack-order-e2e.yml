name: Fix email ACK ordering E2E

on:
  push:
    branches:
      - staging-browser-e2e
    paths:
      - 'scripts/fix_email_ack_order_e2e.py'
      - '.github/workflows/fix-email-ack-order-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-browser-e2e
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded repair
        run: python3 scripts/fix_email_ack_order_e2e.py
      - name: Verify inline JavaScript syntax
        run: python3 scripts/check_inline_js.py
      - name: Commit repaired HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'fix(test): validate media before ACK token in E2E copy'
          git push origin HEAD:staging-browser-e2e
