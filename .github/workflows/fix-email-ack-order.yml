name: Fix email ACK ordering

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - 'scripts/fix_email_ack_order.py'
      - '.github/workflows/fix-email-ack-order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded email ACK ordering fix
        run: python3 scripts/fix_email_ack_order.py
      - name: Verify every inline JavaScript block
        run: python3 scripts/check_inline_js.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'fix(staging): validate media before creating ACK token'
          git push origin HEAD:staging-production-hardening
