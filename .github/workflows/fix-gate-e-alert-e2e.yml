name: Fix Gate E alert syntax (E2E branch)

on:
  push:
    branches:
      - staging-browser-e2e
    paths:
      - '.github/workflows/fix-gate-e-alert-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-browser-e2e
          fetch-depth: 0
      - name: Apply exact guarded fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('aftepistasia.html')
          s=p.read_text(encoding='utf-8')
          old="""    alert('🚫 Ανιχνεύθηκαν '+sigs+'/'+req+' ψηφιακές υπογραφές.

Η παραλαβή απαιτεί όλες τις υπογραφές (Άρθρο 9). Ανεβάστε το πλήρως υπογεγραμμένο πρωτόκολλο.');"""
          new="""    alert('🚫 Ανιχνεύθηκαν '+sigs+'/'+req+' ψηφιακές υπογραφές.\\n\\nΗ παραλαβή απαιτεί όλες τις υπογραφές (Άρθρο 9). Ανεβάστε το πλήρως υπογεγραμμένο πρωτόκολλο.');"""
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one broken Gate E alert, found {s.count(old)}')
          s=s.replace(old,new,1)
          if old in s or new not in s:
              raise SystemExit('Gate E syntax replacement invariant failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify every inline script
        run: python3 scripts/check_inline_js.py
      - name: Commit E2E copy fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'fix(test): mirror Gate E syntax repair in browser branch'
          git push origin HEAD:staging-browser-e2e
