name: Fix Gate E alert syntax E2E

on:
  push:
    branches:
      - staging-browser-e2e
    paths:
      - 'scripts/fix_gate_e_alert_e2e.py'
      - '.github/workflows/fix-gate-e-alert-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-browser-e2e
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded repair
        run: python3 scripts/fix_gate_e_alert_e2e.py
      - name: Verify all inline JavaScript
        run: python3 scripts/check_inline_js.py
      - name: Commit repaired HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'fix(test): mirror Gate E syntax repair in browser branch'
          git push origin HEAD:staging-browser-e2e
