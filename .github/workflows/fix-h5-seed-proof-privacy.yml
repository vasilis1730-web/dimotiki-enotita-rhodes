name: Fix H5 proof privacy assertion

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - 'scripts/fix_h5_seed_proof_privacy.py'
      - '.github/workflows/fix-h5-seed-proof-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - name: Apply guarded H5 proof privacy assertion fix
        run: python3 scripts/fix_h5_seed_proof_privacy.py
      - name: Commit seed assertion fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/seed.sql
          git commit -m 'fix(staging): keep H5 proof table private to clients'
          git push origin HEAD:staging-production-hardening
