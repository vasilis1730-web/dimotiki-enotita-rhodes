name: Fix verifier TS6 compatibility

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - 'scripts/fix_verifier_ts6.py'
      - '.github/workflows/fix-verifier-ts6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply guarded compatibility patch
        run: python3 scripts/fix_verifier_ts6.py
      - name: Type-check all Edge Functions
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            deno check "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 | sort -z)
      - name: Commit verifier fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/verify-pdf-signatures/index.ts
          git commit -m 'fix(staging): make PDF verifier compatible with Deno TypeScript 6'
          git push origin HEAD:staging-production-hardening
