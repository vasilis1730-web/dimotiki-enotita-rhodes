name: Frontend release hardening

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - scripts/frontend_release_hardening.py
      - .github/workflows/frontend-release-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded release hardening
        run: python scripts/frontend_release_hardening.py
      - name: Commit HTML hardening
        run: |
          if git diff --quiet -- index.html aftepistasia.html ack.html; then
            echo 'No HTML diff produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html aftepistasia.html ack.html
          git commit -m 'security(staging): pin browser deps and add baseline CSP manifests'
          git push origin HEAD:staging-production-hardening
