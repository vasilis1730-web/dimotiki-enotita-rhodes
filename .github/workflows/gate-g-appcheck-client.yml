name: Gate G App Check client patch

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - scripts/gate_g_appcheck_client.py
      - .github/workflows/gate-g-appcheck-client.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded App Check patch
        run: python scripts/gate_g_appcheck_client.py
      - name: Commit citizen client changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No citizen client diff produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'security(staging): require App Check for citizen attachments'
          git push origin HEAD:staging-production-hardening
