name: Gate G citizen bridge App Check patch

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - '.github/workflows/gate-g-citizen-bridge-appcheck.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - name: Apply guarded client patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function callBridge(action, payload){')
          end=s.find('// ════════════════ PRIVATE ATTACHMENTS', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('citizen bridge markers not found')
          seg=s[start:end]
          if "'x-firebase-appcheck':appCheckToken" in seg:
              raise SystemExit('bridge already patched')
          needle="  if(!idToken) return { ok:false, noAuth:true };\n"
          if seg.count(needle)!=1:
              raise SystemExit(f'idToken guard expected once, found {seg.count(needle)}')
          seg=seg.replace(needle, needle+"  let appCheckToken='';\n  try{ appCheckToken = window._getAppCheckToken ? await window._getAppCheckToken() : ''; }catch(_){ appCheckToken=''; }\n  if(!appCheckToken) return { ok:false, status:401, error:'Η ασφαλής επαλήθευση της εφαρμογής δεν είναι διαθέσιμη.' };\n",1)
          old="headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY },"
          new="headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'x-firebase-id-token':idToken, 'x-firebase-appcheck':appCheckToken },"
          if seg.count(old)!=1:
              raise SystemExit(f'bridge header expected once, found {seg.count(old)}')
          seg=seg.replace(old,new,1)
          for required in ["'x-firebase-id-token':idToken","'x-firebase-appcheck':appCheckToken","if(!appCheckToken)"]:
              if required not in seg: raise SystemExit('missing invariant: '+required)
          s=s[:start]+seg+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched citizen client
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'security(staging): require App Check on citizen bridge calls'
          git push origin HEAD:staging-production-hardening
