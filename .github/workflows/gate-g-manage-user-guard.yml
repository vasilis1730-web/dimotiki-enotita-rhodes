name: Gate G manage-user client guard

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - scripts/gate_g_manage_user_guard.py
      - .github/workflows/gate-g-manage-user-guard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded manage-user admin patch
        run: python scripts/gate_g_manage_user_guard.py
      - name: Commit staff client patch
        run: |
          if git diff --quiet -- aftepistasia.html; then
            echo 'No staff client diff produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'security(staging): guard user management to Administrator'
          git push origin HEAD:staging-production-hardening
