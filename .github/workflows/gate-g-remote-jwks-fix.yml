name: Gate G remote JWKS fix

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - scripts/gate_g_remote_jwks_fix.py
      - .github/workflows/gate-g-remote-jwks-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded remote JWKS patch
        run: python scripts/gate_g_remote_jwks_fix.py
      - name: Commit function patch
        run: |
          if git diff --quiet -- supabase/functions/citizen-attachments/index.ts; then
            echo 'No Edge Function diff produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/citizen-attachments/index.ts
          git commit -m 'fix(staging): verify App Check with remote JWKS resolver'
          git push origin HEAD:staging-production-hardening
