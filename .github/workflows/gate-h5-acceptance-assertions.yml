name: Gate H5 acceptance assertions

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - 'scripts/gate_h5_acceptance_assertions.py'
      - '.github/workflows/gate-h5-acceptance-assertions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - name: Apply Gate H5 SQL assertion patch
        run: python3 scripts/gate_h5_acceptance_assertions.py
      - name: Commit migration/seed changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260810114000_verified_pdf_acceptance_transaction.sql supabase/seed.sql
          git commit -m 'test(staging): assert proof-only atomic acceptance behavior'
          git push origin HEAD:staging-production-hardening
