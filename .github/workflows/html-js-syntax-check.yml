name: HTML inline JavaScript syntax

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - 'index.html'
      - 'aftepistasia.html'
      - 'ack.html'
      - 'scripts/check_inline_js.py'
      - '.github/workflows/html-js-syntax-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every inline script
        run: python3 scripts/check_inline_js.py
