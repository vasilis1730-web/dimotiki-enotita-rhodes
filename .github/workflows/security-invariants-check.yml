name: Security invariants check

on:
  pull_request:
    paths:
      - 'ack.html'
      - 'audit/dependencies/package.json'
      - 'aftepistasia.html'
      - 'index.html'
      - 'supabase/functions/**/*.ts'
      - 'supabase/migrations/**'
      - 'scripts/check_security_invariants.py'
      - 'scripts/check_citizen_classification_parity.js'
      - '.github/workflows/security-invariants-check.yml'
  push:
    branches:
      - staging-production-hardening
    paths:
      - 'ack.html'
      - 'audit/dependencies/package.json'
      - 'aftepistasia.html'
      - 'index.html'
      - 'supabase/functions/**/*.ts'
      - 'supabase/migrations/**'
      - 'scripts/check_security_invariants.py'
      - 'scripts/check_citizen_classification_parity.js'
      - '.github/workflows/security-invariants-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release security invariants
        run: python3 scripts/check_security_invariants.py
      - name: Check citizen classification parity
        run: node scripts/check_citizen_classification_parity.js

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: audit/dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned release dependencies
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Audit release dependencies
        run: npm audit --omit=dev --audit-level=moderate
