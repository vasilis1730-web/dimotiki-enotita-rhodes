name: Server-authoritative PDF acceptance client

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - 'scripts/server_verified_acceptance_client.py'
      - '.github/workflows/server-verified-acceptance-client.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded client patch
        run: python3 scripts/server_verified_acceptance_client.py
      - name: Verify all inline JavaScript
        run: python3 scripts/check_inline_js.py
      - name: Commit client hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'security(staging): finalize PDF acceptance only through server proof RPC'
          git push origin HEAD:staging-production-hardening
