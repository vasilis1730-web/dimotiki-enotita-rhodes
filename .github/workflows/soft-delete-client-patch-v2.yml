name: Soft delete client patch v2

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - scripts/soft_delete_client_patch.py
      - .github/workflows/soft-delete-client-patch-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded client patch
        run: python scripts/soft_delete_client_patch.py
      - name: Commit client patch
        run: |
          if git diff --quiet -- aftepistasia.html; then
            echo 'No staff client diff produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'security(staging): route core deletion through audited soft-delete RPC'
          git push origin HEAD:staging-production-hardening
