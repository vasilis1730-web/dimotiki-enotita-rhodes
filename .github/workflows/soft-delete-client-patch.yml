name: Soft delete client patch

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - '.github/workflows/soft-delete-client-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - name: Apply guarded soft-delete patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aftepistasia.html')
          s=p.read_text(encoding='utf-8')
          orig=s

          start=s.find('async function _v9DeleteRows(table, ids){')
          if start < 0:
              raise SystemExit('_v9DeleteRows start not found')
          end=s.find('\n}\n', start)
          if end < 0:
              raise SystemExit('_v9DeleteRows end not found')
          end += 3
          old=s[start:end]
          if ".delete().in('id', part)" not in old:
              raise SystemExit('expected physical delete call not found')
          new="""async function _v9DeleteRows(table, ids){
  const sb = getSupabase && getSupabase();
  const list = (Array.isArray(ids) ? ids : [ids]).filter(x => x !== undefined && x !== null && String(x).trim() !== '').map(String);
  if(!sb || !list.length) return {ok:true, skipped:true};
  const allowed = new Set(['rodios_issues','rodios_work_orders','rodios_payments','rodios_service_staff']);
  if(!allowed.has(String(table||''))) throw new Error('Μη υποστηριζόμενη οντότητα αρχειοθέτησης.');

  // Gate release hardening: rows are never physically deleted from the browser.
  // Administrator-only server RPC sets deleted_at and leaves an audit trail.
  for(let i=0; i<list.length; i+=100){
    const part = list.slice(i, i+100);
    const { data, error } = await sb.rpc('rodios_soft_delete', {p_entity:String(table), p_ids:part});
    if(error){
      console.error('[v9 soft delete failed]', table, part, error);
      throw error;
    }
    if(Number(data||0) < 0) throw new Error('Μη έγκυρη απάντηση αρχειοθέτησης.');
  }
  return {ok:true};
}
"""
          s=s[:start]+new+s[end:]

          reps={
            "return {id, data:c, deleted_at:null};":"return {id, data:c};",
            "return {id:String(c.id), data:c, deleted_at:null};":"return {id:String(c.id), data:c};",
            "return {id:String(c.id), issue_id:c.issueId||c.issue_id||null, data:c, deleted_at:null};":"return {id:String(c.id), issue_id:c.issueId||c.issue_id||null, data:c};",
            "return {id:String(c.id), work_order_id:c.workOrderId||c.orderId||c.woId||c.work_order_id||null, data:c, deleted_at:null};":"return {id:String(c.id), work_order_id:c.workOrderId||c.orderId||c.woId||c.work_order_id||null, data:c};",
            "if(userDeletes.length) await _v9DeleteRows('rodios_app_users', userDeletes);":"if(userDeletes.length) console.warn('[v9] App-user deletion is managed only through manage-app-user; sync delete skipped.', userDeletes);"
          }
          for oldtxt,newtxt in reps.items():
              count=s.count(oldtxt)
              if oldtxt.startswith('return {id, data:c'):
                  if count < 1: raise SystemExit('staff normalize row pattern missing')
                  s=s.replace(oldtxt,newtxt)
              elif oldtxt.startswith('return {id:String(c.id), data:c'):
                  # This pattern also appears for users. Remove deleted_at from all upserts; app-user RLS remains admin-only.
                  if count < 1: raise SystemExit('generic row pattern missing')
                  s=s.replace(oldtxt,newtxt)
              else:
                  if count != 1: raise SystemExit(f'expected one match for {oldtxt[:45]!r}, got {count}')
                  s=s.replace(oldtxt,newtxt,1)

          if ".delete().in('id', part)" in s:
              raise SystemExit('physical core-row delete call remains')
          if "sb.rpc('rodios_soft_delete'" not in s:
              raise SystemExit('soft delete RPC call missing')
          if "_v9DeleteRows('rodios_app_users'" in s:
              raise SystemExit('app-user generic delete call remains')
          if s == orig:
              raise SystemExit('no changes produced')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit client patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'security(staging): route core deletion through audited soft-delete RPC'
          git push origin HEAD:staging-production-hardening
