name: Staging citizen client patch

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - '.github/workflows/staging-client-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'vasilis1730-web/dimotiki-enotita-rhodes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded citizen patch
        run: python scripts/patch_citizen_private_attachments.py
      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "index.html"
      - name: Commit patched citizen client
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No client changes to commit.'
            exit 0
          fi
          git config user.name 'rodios-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Route citizen attachments through secure private Storage service'
          git push origin HEAD:staging-production-hardening
