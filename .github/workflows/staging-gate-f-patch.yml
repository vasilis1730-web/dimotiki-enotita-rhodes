name: Staging Gate F settings config logout patch

on:
  push:
    branches:
      - staging-production-hardening
    paths:
      - '.github/workflows/staging-gate-f-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-production-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded Gate F patch
        run: python scripts/patch_gate_f_settings_config_logout.py
      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "aftepistasia.html"
      - name: Commit Gate F client changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rodios-staging-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add aftepistasia.html
          git commit -m 'Lock settings environment config and purge caches on logout'
          git push origin HEAD:staging-production-hardening
