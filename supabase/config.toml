# RODIOS Supabase Edge Function authentication policy — Gate G
# Citizen endpoints use external Firebase identity and therefore verify Firebase
# Auth + App Check inside the handler. Staff endpoints require a Supabase user JWT
# at the gateway and independently enforce an active application profile in code.

[functions.citizen-bridge]
verify_jwt = false

[functions.citizen-attachments]
verify_jwt = false

[functions.manage-app-user]
verify_jwt = true

[functions.send-order-email]
verify_jwt = true

[functions.verify-pdf-signatures]
verify_jwt = true

[functions.parse-municipal-pdf]
verify_jwt = true

[functions.resolve-maps-link]
verify_jwt = true

[functions.preview-static-publisher]
verify_jwt = false
